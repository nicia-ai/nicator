passFail:
  description: >-
    This task tests recency discrimination. Expected: recency-only configs
    preserve late facts (canary-epsilon, canary-zeta) but drop early facts
    (canary-alpha, canary-beta). No-recency configs should show the
    opposite pattern. A flat 100% across configs means the budget is too
    generous.

definitionOverrides:
  systemPrompt: >-
    You are an executive analyst at NovaMaterials Inc. reviewing divisional
    quarterly reports. First, retrieve each division's report using the
    retrieve-document tool (call it once per source ID, in order from
    src-1 through src-6). After retrieving all six, use the summarizer
    skill to produce an executive summary referencing the exact metric
    values from each division. Do not skip any division. Use only the
    exact numbers from the documents.
  skills:
    - name: researcher
      version: "1.0.0"
      policy:
        type: always
    - name: summarizer
      version: "1.0.0"
      policy:
        type: always
  limits:
    maxTasksPerRun: 25
    maxTokensPerRun: 50000

graphAssertions:
  - type: run_status
    status: completed
    description: "Run should complete within the tight budget"

  - type: task_count
    match:
      subagentName: researcher
    min: 6
    description: "At least 6 researcher activations for the 6 divisions"

  - type: task_exists
    match:
      subagentName: summarizer
    description: "Summarizer should be activated for the executive summary"
