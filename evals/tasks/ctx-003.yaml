referenceFacts:
  - id: canary-ks
    description: "Kelvin-Strauss coefficient from src-1 (high downstream: consumed by src-4 and src-6)"
    canonical: "0.847"
    pattern: "0\\.847"
    weight: 2
    canary: true
  - id: canary-tbdi
    description: "Thornfield Index from src-2 (high downstream: consumed by src-5 and src-6)"
    canonical: "23.4"
    pattern: "23\\.4"
    weight: 2
    canary: true
  - id: canary-mercer
    description: "Mercer yield from src-3 (zero downstream: orphan, not consumed)"
    canonical: "61.2"
    pattern: "61\\.2"
    weight: 1
    canary: true
  - id: canary-adjusted-ks
    description: "Adjusted K-S ratio from src-4 (medium downstream: consumed by src-6)"
    canonical: "0.912"
    pattern: "0\\.912"
    weight: 1
    canary: true
  - id: canary-tbdi-cost
    description: "TBDI-adjusted cost from src-5 (zero downstream: orphan, not consumed)"
    canonical: "$284"
    pattern: "\\$?284"
    weight: 1
    canary: true
  - id: canary-vandermeer
    description: "Vandermeer score from src-6 (final synthesis: always in context)"
    canonical: "7.3"
    pattern: "7\\.3"
    weight: 1
    canary: true
  - id: chain-ks-flow
    description: "References the K-S flow from src-1 through src-4 to src-6"
    canonical: "0.847 to 0.912"
    pattern: "0\\.847.*0\\.912|src-1.*src-4.*src-6|extraction.*adjust"
    weight: 1
  - id: orphan-mercer
    description: "Notes that the Mercer yield is standalone / not referenced elsewhere"
    canonical: "standalone"
    pattern: "standalone|independent|not.*(reference|depend|connect|consum|use)"
    weight: 1

passFail:
  description: >-
    This task is designed to produce DIFFERENT scores across weight
    configurations. A flat 100% across configs means the budget is too
    generous. Expected: downstream-heavy configs preserve canary-ks,
    canary-tbdi, and chain-ks-flow; recency-only configs may drop them.

definitionOverrides:
  systemPrompt: >-
    You are a research analyst at NovaMaterials Inc. You are reviewing
    six internal reports seeded as artifacts in your context. First,
    read each artifact using the read_artifact tool (one call per
    artifact_id shown in your Completed Tasks). After reading all six,
    produce a synthesis that references the specific figures requested.
    Do not skip any artifact. Do not invent figures — use only the
    exact numbers from the documents.
  skills: []
  limits:
    maxTasksPerRun: 25
    maxTokensPerRun: 60000

graphAssertions:
  - type: run_status
    status: completed
    description: "Run should complete within the tight budget"

  - type: task_count
    match:
      role: tool
      subagentName: read_artifact
    min: 6
    description: "read_artifact must be called once per seeded input (6 total)"
