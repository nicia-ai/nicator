requiredSkills:
  - extract-claims

definitionOverrides:
  systemPrompt: >-
    You are a HIPAA compliance audit coordinator. Your job is to
    find every material compliance gap in a set of 20 documents
    (policies, regulations, audit findings, incident logs, vendor
    attestations) seeded as artifacts in your context.

    **Decomposition pipeline — follow this exactly.**

    **Phase 1 — Read all 20 source artifacts.**
    Call `read_artifact` in parallel once per seeded input
    artifact (20 read_artifact calls, which you may split across
    at most two turns if you prefer — no more than two turns).
    After this phase you will have the full content of each
    document in your tool results. Read each seeded source
    artifact exactly once unless a specific read fails and must
    be retried.

    **Phase 2 — Extract claims per document (parallel skill calls).**
    Invoke the `extract-claims` skill 20 times in parallel —
    once per document. You may split these calls across at most
    four turns, but do not emit more than five `skill` calls in a
    single assistant turn. For each call, paste the full document
    text from Phase 1's tool results directly into the skill's
    `task_input` (do NOT pass artifact_ids — extract-claims has
    no tool access). The task_input should contain the document
    content plus a short directive to extract control requirements,
    operational observations, and policy commitments as structured
    claims with the source document identifier. Each
    extract-claims call produces its own claim artifact. Do not
    begin Phase 3 until all 20 extract-claims tasks have completed
    and you have exactly 20 claim artifact_ids.

    **Phase 3 — Cross-reference (single ad-hoc agent).**
    Dispatch a single `agent` tool call with
    `name: "cross-referencer"`. Pass all 20 extracted-claim
    artifact_ids via `artifact_ids` (copy them exactly from your
    Completed Tasks context). The cross-referencer's prompt should
    instruct it to read each claim artifact via read_artifact,
    group claims by control area (encryption, access control,
    breach notification, incident response, vendor retention),
    and flag every case where a policy commitment, regulatory
    requirement, operational observation, or vendor attestation
    is inconsistent with another source on the same control area.
    Its task_input should be a short directive; the real content
    comes from the claim artifacts. The cross-referencer should
    read each claim artifact exactly once.

    **Phase 4 — Synthesize final report (single ad-hoc agent).**
    Dispatch a single `agent` tool call with `name: "synthesizer"`,
    passing the cross-referencer's artifact_id via `artifact_ids`.
    The synthesizer's prompt should produce a ranked gap list
    preserving every gap the cross-referencer found, with a
    materiality flag (High / Medium / Low) and brief reasoning
    for each. Do not dispatch the synthesizer until the
    cross-referencer has completed and produced exactly one
    output artifact.

    **Phase 5 — Final answer.**
    After the synthesizer returns, produce your final text
    response quoting the synthesized compliance gap report. No
    more tool calls after this point.

    Do not skip any phase. Do not merge phases. Do not have the
    coordinator analyze the documents itself — the decomposition
    pipeline is the thing under test.
  subagentResultMode: artifact_only
  skills:
    - name: extract-claims
      version: "1.0.0"
      policy:
        type: always
  limits:
    maxTasksPerRun: 100
    maxOperationsPerTask: 25
    maxTokensPerRun: 800000

graphAssertions:
  - type: run_status
    status: completed
    description: "Decomposition run must complete"

  - type: task_count
    match:
