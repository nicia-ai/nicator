# DCV-002 · decomposition-value
#
# Second decomposition-value task. Follows the dcv-001 finding that
# 10 × ~400-token documents fit comfortably inside Sonnet's flat-pass
# attention budget. This task scales two axes simultaneously:
#
#   - Document length: ~640-980 tokens each (vs 400 in dcv-001)
#   - Document count: 20 (vs 10)
#
# Total seeded context: ~16K tokens across 20 compliance documents
# based on the declared tokenCount estimates below. This is still below
# the ~25K dcv-002+ stress target described in docs/layered-evals.md,
# so the task is intended to discriminate primarily through buried facts,
# cross-source joins, and deterministic multi-document citation
# requirements rather than raw context saturation alone.
#
# The scenario is a regulatory compliance audit for a fictional
# healthcare data processor (MeridianHealth Data Systems). Five
# compliance gaps are planted, each requiring 2-3-way cross-document
# lookup across heterogeneous source types (internal policy vs
# regulation vs auditor finding vs vendor attestation vs incident log).
# Several gaps are buried inside narrative paragraphs surrounded by
# consistent, confirming ballast content — the single-pass model tends
# to average over consistency and miss outliers, while a claim-by-claim
# extractor treats every claim equally.
#
# Planted gaps (all five are required for pass):
#
#   1. Breach notification timing: internal policy says 72h, state
#      regulation says 60h. Federal HIPAA Breach Notification Rule
#      (60 days) appears as a distractor — policy is consistent with
#      federal but violates the stricter state requirement.
#
#   2. Encryption strength (three-way): encryption policy specifies
#      AES-128 minimum, HHS enforcement guidance references AES-256
#      as the safe-harbor standard, pentest findings observed AES-128
#      in production endpoints handling PHI.
#
#   3. Vendor data retention: MedScribe BAA limits retention to 30
#      days, but incident log HX-2025-07 shows data retained 90 days
#      during a forensic investigation — no amendment on file.
#
#   4. Incident response SLA: incident response policy specifies 4-hour
#      response SLA for Sev-1 incidents; Q4 metrics report shows
#      actual average of 7.5 hours.
#
#   5. MFA carveout: access control policy requires MFA for all PHI
#      access with no exceptions stated; CareConnect vendor SOC 2
#      excerpt discloses a break-glass procedure that bypasses
#      secondary auth; access control audit logged 14 break-glass
#      invocations in a 6-month window.

id: dcv-002
category: decomposition-value
metadata:
  purpose: mechanism
  realism: synthetic
  releaseGate: research
  comparisonMode: flat-harness
  workloadFamily: compliance-audit
  hypothesis: decomposition improves coverage on buried multi-source compliance gaps before raw context saturation dominates
  stressAxes:
    - context_volume
    - join_arity
    - distractor_density
name: MeridianHealth compliance audit — cross-source gap identification
description: >-
  20 compliance documents covering policies, regulations, audit
  findings, incident logs, and vendor attestations for a healthcare
  data processor. Identify every material compliance gap — places
  where an internal control, operational reality, or vendor practice
  diverges from an applicable regulatory requirement. Five gaps are
  planted; each requires cross-referencing 2-3 source documents.

