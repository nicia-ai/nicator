      # MDS-VEN-003 — TrueNorth Laboratories BAA (Excerpt)
      **Contracting parties:** MeridianHealth Data Systems, Inc.
      and TrueNorth Laboratories, Inc.
      **Effective date:** 2023-11-15
      **Term:** 5 years, auto-renewing 1-year terms

      TrueNorth is a reference laboratory providing clinical
      test results that are ingested into the MDS clinical
      data warehouse on behalf of several covered-entity
      customers. The full BAA is maintained by MDS Legal.

      ## Section 4 — Permitted Uses and Disclosures

      TrueNorth shall use and disclose PHI only as necessary
      to transmit test results and as otherwise permitted by
      the HIPAA Privacy Rule applicable to TrueNorth's status
      as a Business Associate of MDS.

      ## Section 5 — Safeguards

      TrueNorth shall maintain administrative, physical, and
      technical safeguards consistent with the HIPAA Security
      Rule. Data in transit between TrueNorth and MDS is
      protected by mutual TLS using AES-256-GCM. Data at rest
