  - id: vendor-axishealth
    title: "MDS-VEN-004 — AxisHealth Cloud SOC 2 Summary (Vendor-Provided)"
    tokenCount: 640
    content: |
      # MDS-VEN-004 — AxisHealth Cloud SOC 2 Summary
      **Vendor:** AxisHealth Cloud, Inc.
      **SOC 2 auditor:** Garrett & Reyes CPA
      **Period covered:** 2024-12-01 through 2025-11-30
      **Service provided to MDS:** Managed cold-storage backup
      for clinical data warehouse archival snapshots

      ## Service Summary

      AxisHealth provides a HIPAA-aligned managed cold-storage
      service used by MDS for long-term retention of clinical
      data warehouse archival snapshots. Snapshots are
      encrypted by MDS before transmission to AxisHealth;
      AxisHealth holds only ciphertext and does not have
      access to the encryption keys.

      ## Relevant Controls

      - **CC6.1.** AxisHealth staff access to the storage
        substrate requires FIDO2 hardware tokens. No standing
        exceptions. Observed operating effectively.
      - **CC6.7.** Data in transit to and from AxisHealth uses
        TLS 1.3 with AES-256-GCM cipher suites exclusively.
      - **CC7.2.** Environmental and physical controls at the
        three AxisHealth data centers were observed operating
        effectively.
      - **A1.2.** Availability commitment: 99.99% monthly.
        Measured performance in the audit period: 99.996%.

      ## MDS Vendor Risk Notes

      Because AxisHealth holds only ciphertext, MDS's exposure
      under the relationship is limited. The encryption keys
      are held in the MDS KMS and never leave MDS control.
      AxisHealth's SOC 2 is reviewed annually and no material
      findings have been identified in the last three annual
      reviews.

      This vendor has no role in the authentication, break-glass,
      or primary-encryption control paths examined elsewhere in
      this audit and is included here for completeness of the
      vendor inventory.

question: |
  You are performing the FY2025 HIPAA compliance audit for
  MeridianHealth Data Systems (MDS). 20 compliance documents have
  been seeded as artifacts in your context: internal policies,
  regulatory references, audit findings, incident logs, and vendor
  attestations. Identify every material compliance gap — places
  where an internal control, an operational reality, or a vendor
  practice is inconsistent with an applicable regulatory requirement
  or a stated MDS policy commitment.

  For each gap:
  - Name the control area
  - Cite the conflicting documents by MDS document ID. Cite every
    source you rely on; some gaps require three documents.
  - State the gap specifically (what each source says)
  - Flag the materiality (High / Medium / Low) with brief reasoning

  Produce a ranked list of compliance gaps, most material first. Do
  not include items where the documents are in agreement.

referenceFacts:
  - id: fact-breach-notification-72h-vs-60h
    description: >-
      MDS-POL-004 commits to 72-hour breach notification; state
      regulation (New Jersey 60-hour requirement per MDS-REG-003)
      is stricter. Gap must cite both document IDs and identify
      the 72-hour internal commitment, the New Jersey requirement,
      and the 60-hour state deadline.
    canonical: "60 hours"
    requiredPatterns:
      - 'MDS-POL-004|pol-incident-response'
      - '72.?hour|72h'
      - 'MDS-REG-003|reg-state-breach'
      - '60.?hour|60h'
      - 'New Jersey|\bNJ\b|N\.J\.S\.A'
    weight: 2

  - id: fact-encryption-aes128-vs-aes256
    description: >-
      MDS-POL-002 specifies AES-128 minimum for data in transit;
      HHS Encryption Safe Harbor guidance (MDS-REG-004) requires
      AES-256; pentest (MDS-AUD-002 finding M-01) observed AES-128
      in production on the customer API endpoint. Gap must cite
      all three document IDs and identify the AES-128 vs AES-256
      conflict across policy, regulation, and production findings.
    canonical: "AES-256"
    requiredPatterns:
      - 'MDS-POL-002|pol-encryption'
      - 'MDS-REG-004|reg-hhs-encryption'
      - 'MDS-AUD-002|audit-pentest|M-01'
      - 'AES.?128'
      - 'AES.?256|256-bit'
      - 'api\.mds\.health|customer API|PHI-bearing endpoint'
    weight: 3

  - id: fact-medscribe-retention-30-vs-90
    description: >-
      MedScribe BAA (MDS-VEN-001 Section 6) sets an absolute
      30-day retention limit with no amendment possible except
      in writing; Incident HX-2025-07 (MDS-INC-001) retained
      MedScribe PHI for 90 days during the forensic hold with
      only an informal email notification, no signed BAA
      amendment. Gap must cite both document IDs and identify
      the 30-day limit, the 90-day retention, and the lack of
      a written amendment.
    canonical: "30 days"
    requiredPatterns:
      - 'MDS-VEN-001|vendor-medscribe'
      - '30.?day'
      - 'written amendment|signed amendment|no oral amendment'
      - 'MDS-INC-001|HX-2025-07|incident-hx-2025-07'
      - '90.?day'
      - 'email|forensic hold'
    weight: 2

  - id: fact-sev1-sla-4h-vs-7h
    description: >-
      MDS-POL-004 Section 3 commits to a 4-hour initial response
      SLA for Sev-1 incidents; MDS-AUD-004 finding IRF-01 and
      MDS-INC-003 show trailing averages of 7.5 hours and 7 hours
      12 minutes respectively. Gap must cite the policy document
      plus at least one operational evidence document and identify
      the 4-hour SLA and materially higher actual performance.
    canonical: "4 hours"
    requiredPatterns:
      - 'MDS-POL-004|pol-incident-response'
      - '4.?hour|4h'
      - 'MDS-AUD-004|MDS-INC-003|audit-incident-response|incident-annual-metrics|IRF-01'
      - '7\.5|7.?hours?.{0,12}12|7h.?12m|6h.?49m'
      - 'Sev-1|initial response'
    weight: 2

  - id: fact-mfa-break-glass-carveout
    description: >-
      MDS-POL-003 Section 2 requires MFA for all PHI access with
      no standing exceptions; CareConnect SOC 2 (MDS-VEN-002)
      discloses a break-glass procedure that bypasses secondary
      authentication; MDS-AUD-003 finding AF-01 documents 14
      break-glass invocations in a 6-month window. Gap must cite
      all three document IDs and identify the policy MFA
      requirement, the break-glass bypass, and the 14 invocations.
    canonical: "MFA"
    requiredPatterns:
      - 'MDS-POL-003|pol-access-control'
      - 'MFA|multi.factor|second authentication factor'
      - 'MDS-VEN-002|vendor-careconnect|CareConnect'
      - 'break.?glass|bypass(es|ed)? the secondary authentication factor'
      - 'MDS-AUD-003|audit-access-control|AF-01'
      - '14.{0,20}invocation'
    weight: 2

  - id: fact-soc2-access-review-timeliness
    description: >-
      Bonus finding: SOC 2 and internal access control audits
      both found three late quarterly access reviews during the
      period. Lower materiality because management has already
      accepted the remediation plan.
    canonical: "quarterly access review"
    requiredPatterns:
      - 'MDS-AUD-001|audit-soc2'
      - 'MDS-AUD-003|audit-access-control'
      - '3'
      - 'quarterly access review|late quarterly access review|late access review'
    weight: 1

