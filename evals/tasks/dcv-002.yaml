  - id: pol-hipaa-framework
    title: "MDS-POL-001 — HIPAA Compliance Framework"
    tokenCount: 820
    content: |
      # MDS-POL-001 — HIPAA Compliance Framework
      **Owner:** Privacy Office | **Version:** 4.2 | **Effective:** 2025-03-01
      **Approvers:** Chief Privacy Officer, Chief Information Security Officer
      **Review cadence:** Annual, or upon material regulatory change

      ## 1. Purpose and Scope

      This document establishes MeridianHealth Data Systems' (MDS)
      overarching framework for compliance with the Health Insurance
      Portability and Accountability Act (HIPAA) of 1996, including
      the Privacy Rule (45 CFR Part 164, Subpart E), the Security
      Rule (45 CFR Part 164, Subpart C), and the Breach Notification
      Rule (45 CFR Part 164, Subpart D). MDS acts as a Business
      Associate to covered entities (hospital networks, physician
      groups, clinical laboratories) and processes Protected Health
      Information ("PHI") on their behalf under executed Business
      Associate Agreements.

      ## 2. Roles and Responsibilities

      - **Chief Privacy Officer (CPO).** Owns HIPAA Privacy Rule
        compliance, responds to individual rights requests, maintains
        the Notice of Privacy Practices template for downstream use.
      - **Chief Information Security Officer (CISO).** Owns HIPAA
        Security Rule compliance, maintains the risk assessment,
        approves all control exceptions.
      - **Compliance Committee.** Meets quarterly; reviews control
        exceptions, incident trends, and vendor risk posture.
      - **Incident Response Team.** See MDS-POL-004 for the full
        incident response procedure and escalation matrix.

      ## 3. Control Families

      MDS implements controls across five families:

      1. **Administrative safeguards** (workforce training, sanctions
         policy, access authorization procedures) — owned by People
         Operations and the Privacy Office.
      2. **Physical safeguards** (facility access, workstation use,
         device and media controls) — owned by Facilities.
      3. **Technical safeguards** (access control, audit controls,
         integrity controls, transmission security) — owned by
         Security Engineering. See MDS-POL-002 and MDS-POL-003.
      4. **Organizational requirements** (Business Associate
         Agreements, subcontractor flow-down) — owned by Legal.
      5. **Policies and procedures** (documentation, retention,
         updates) — owned by the Privacy Office.

      ## 4. Policy Hierarchy

      This framework sits above the following implementing policies:

      - MDS-POL-002: Encryption & Transport Security Policy
      - MDS-POL-003: Access Control & Authentication Policy
      - MDS-POL-004: Incident Response Policy
      - MDS-POL-005: Workforce Training Policy (not in scope for
        this audit cycle)
      - MDS-POL-006: Data Retention and Disposal Policy

      Where an implementing policy conflicts with this framework,
      the framework governs and the implementing policy must be
      updated within 30 days of identification.

      ## 5. Compliance Attestation

      MDS's CISO attests annually to the Compliance Committee that
      the control environment is designed and operating effectively
      to meet HIPAA Security Rule requirements. The FY2025
      attestation was signed 2026-01-15 with the caveat that three
      control exceptions remain open pending remediation; those
      exceptions are tracked in the Compliance Committee minutes.

  - id: pol-encryption
    title: "MDS-POL-002 — Encryption & Transport Security Policy"
    tokenCount: 900
    content: |
      # MDS-POL-002 — Encryption & Transport Security Policy
      **Owner:** Security Engineering | **Version:** 3.1
      **Effective:** 2025-06-15 | **Approver:** CISO

      ## 1. Purpose

      This policy defines the cryptographic standards applied to
      Protected Health Information ("PHI") at rest and in transit
      across MeridianHealth Data Systems environments. It implements
      the transmission security and encryption addressable
      implementation specifications of the HIPAA Security Rule
      (45 CFR 164.312(a)(2)(iv) and 164.312(e)(2)(ii)).

      ## 2. Data-at-Rest Encryption

      All PHI stored in MDS systems, including primary databases,
      object storage, backups, and ephemeral caches with a lifetime
      greater than 60 seconds, must be encrypted using AES-256 in
      GCM mode with keys managed by the MDS Key Management Service
      (KMS). Key rotation occurs on a 365-day schedule; emergency
      rotation may be initiated by the CISO.

      Database-level encryption (e.g., TDE) is used for the primary
      clinical data warehouse. Object storage uses server-side
      encryption with customer-managed keys. Backups are encrypted
      with the same AES-256 standard prior to being written to
      offline cold storage.

      ## 3. Data-in-Transit Encryption

      All network communications carrying PHI must use Transport
      Layer Security (TLS). The minimum acceptable configuration is:

      - **TLS version:** 1.2 or higher (1.3 preferred for new systems)
      - **Cipher suites:** AES-128 minimum symmetric strength
      - **Certificate authority:** Only CAs on the MDS approved list
      - **Certificate validity:** Maximum 397 days

      TLS 1.2 with AES-128-GCM or AES-256-GCM cipher suites is the
      baseline accepted configuration for all externally-facing PHI
      endpoints. TLS 1.0, TLS 1.1, SSL 3.0, and any cipher suite
      offering less than 128-bit symmetric strength are prohibited.

      ## 4. Certificate Management

      Certificates are managed through the MDS Certificate Authority
      with automated renewal via ACME. Short-lived certificates
      (30-day validity) are used for internal service-to-service
      communication within the production VPC.

      ## 5. Exceptions

      Exceptions to this policy require written approval from the
      CISO and must be documented in the exception register. No
      standing exceptions exist as of the last review cycle.

      ## 6. Compliance Mapping

      | Regulatory Reference              | Control                    |
      |-----------------------------------|----------------------------|
      | HIPAA 164.312(a)(2)(iv)           | Section 2 (at-rest AES-256)|
      | HIPAA 164.312(e)(2)(ii)           | Section 3 (in-transit TLS) |
      | NIST SP 800-52r2                  | Section 3 (TLS baseline)   |
      | HHS Encryption Safe Harbor (2009) | Sections 2 and 3           |

      The HHS Encryption Safe Harbor reference above provides that
      data encrypted in accordance with National Institute of
      Standards and Technology (NIST) guidance is "secured" and
      therefore not subject to the breach notification requirements
      of the HITECH Act. See MDS-REG-004 for the operative HHS
      guidance and the specific NIST publications it references.

  - id: pol-access-control
    title: "MDS-POL-003 — Access Control & Authentication Policy"
    tokenCount: 880
    content: |
      # MDS-POL-003 — Access Control & Authentication Policy
      **Owner:** Security Engineering | **Version:** 2.7
      **Effective:** 2025-04-01 | **Approver:** CISO

      ## 1. Purpose

      This policy establishes the access control and authentication
      requirements for any system, application, or data store
      containing Protected Health Information ("PHI"). It implements
      the access control standard of the HIPAA Security Rule
      (45 CFR 164.312(a)).

      ## 2. Authentication Requirements for PHI Access

      **All PHI access requires multi-factor authentication (MFA).**
      No user account — workforce member, contractor, service account
      operating on behalf of a human, or emergency response role —
      may access a system containing PHI without successfully
      completing a second authentication factor in addition to a
      password or equivalent primary credential.

      Acceptable second factors:

      - Hardware security key (FIDO2/WebAuthn) — preferred
      - Time-based one-time password (TOTP) from an approved
        authenticator app
      - Push notification to an enrolled mobile device with device
        binding

      SMS-based one-time codes are NOT an acceptable second factor
      for PHI access as of 2024-01-01, in alignment with NIST SP
      800-63B AAL2 guidance.

      ## 3. Role-Based Access Control

      All PHI access is mediated through a role-based access control
      (RBAC) model. Roles are defined by the system owner, reviewed
      quarterly by the Compliance Committee, and attested annually
      by the workforce member's manager. Privileged roles (admin,
      audit, break-glass) are additionally reviewed monthly.

      ## 4. Session Management

      - Maximum interactive session length: 12 hours
      - Maximum idle timeout before re-authentication: 15 minutes
      - Concurrent session limit: 3 (CISO may adjust for specific
        clinical workflows)

      ## 5. Account Lifecycle

      Workforce member accounts are provisioned within one business
      day of a hiring manager's approved access request, and are
      deprovisioned within 4 hours of termination notification from
      People Operations. Access reviews are conducted quarterly for
      standard roles and monthly for privileged roles.

      ## 6. Logging

      All authentication events (successful and failed) and all PHI
      access events are logged to the central SIEM with 7-year
      retention in accordance with MDS-POL-006. Logs are immutable,
      timestamped, and include the user identifier, source IP,
      session identifier, and accessed resource identifier. MFA
      factor used is recorded in the authentication event.

      ## 7. Compliance Mapping

      This policy does not provide for any exception to the MFA
      requirement in Section 2. Any request for an exception must
      be submitted to the CISO in writing and will be evaluated
      against the HIPAA Security Rule's access control standard.
      No standing exceptions exist as of the 2025-Q4 compliance
      committee review.

  - id: pol-incident-response
    title: "MDS-POL-004 — Incident Response Policy"
    tokenCount: 980
    content: |
      # MDS-POL-004 — Incident Response Policy
      **Owner:** Security Engineering | **Version:** 5.0
      **Effective:** 2025-09-01 | **Approver:** CISO

      ## 1. Purpose

      This policy defines MeridianHealth Data Systems' procedure
      for detecting, classifying, containing, eradicating, and
      recovering from security incidents, and for notifying
      affected parties when a reportable breach of PHI is
      confirmed. It implements the HIPAA Security Incident
      Procedures standard (45 CFR 164.308(a)(6)).

      ## 2. Incident Classification

      Incidents are classified on a four-tier severity scale:

      - **Sev-1 (Critical).** Confirmed unauthorized access to PHI,
        material service disruption affecting clinical workflows,
        or active ransomware.
      - **Sev-2 (High).** Credible indicator of compromise with
        PHI exposure potential but no confirmed unauthorized access.
      - **Sev-3 (Medium).** Policy violation or control failure
        without confirmed PHI impact.
      - **Sev-4 (Low).** Informational finding from automated
        monitoring requiring triage but no active response.

      ## 3. Response Service Levels

      The following service-level commitments apply from the time an
      incident is opened in the tracking system:

      | Severity | Initial response time | Containment target |
      |----------|-----------------------|--------------------|
      | Sev-1    | **4 hours**           | 24 hours           |
      | Sev-2    | 8 hours               | 72 hours           |
      | Sev-3    | 1 business day        | 10 business days   |
      | Sev-4    | 5 business days       | Best effort        |

      "Initial response" is defined as assignment of an incident
      commander, confirmation of the severity classification, and
      first containment action (or documented determination that
      no immediate containment is required). These SLAs are
      measured by the IR team and reported quarterly to the
      Compliance Committee.

      ## 4. Breach Notification

      When an incident is classified as a confirmed breach of
      unsecured PHI, notification is performed according to the
      following sequence:

      1. Covered entity notification: MDS notifies the affected
         covered entity(ies) as their Business Associate within
         the timeframe specified in the applicable BAA (typically
         10 calendar days).
      2. Regulator notification: MDS supports the covered entity's
         obligation to notify HHS and, where applicable, state
         regulators. All such breach notifications will be
         completed within **72 hours** of confirmation.
      3. Individual notification: Performed by the covered entity
         under its own Notice of Privacy Practices; MDS supports
         with individual identifiers and incident metadata.

      The 72-hour figure in item 2 reflects MDS's internal
      commitment and is intended to meet or exceed federal HIPAA
      Breach Notification Rule requirements. State law variations
      are tracked by the Legal team and communicated to the IR
      team as applicable; see MDS-REG-003 for state-specific
      requirements.

      ## 5. Post-Incident Review

      Every Sev-1 and Sev-2 incident is subject to a post-incident
      review within 30 days of closure. Findings are tracked in
      the incident retrospectives register and reviewed quarterly
      by the Compliance Committee.

  - id: reg-hipaa-security
    title: "MDS-REG-001 — HIPAA Security Rule Summary (45 CFR 164.312)"
    tokenCount: 780
    content: |
      # MDS-REG-001 — HIPAA Security Rule Summary
      **Scope:** 45 CFR Part 164, Subpart C — Technical Safeguards
      **Maintained by:** Legal & Compliance
      **Last reviewed:** 2025-11-20

      This document is a working summary maintained by MDS Legal &
      Compliance of the technical safeguards required under the
      HIPAA Security Rule. It is not a substitute for the operative
      regulation; it is a reference for control owners and auditors.

      ## 164.312(a) — Access Control

      A covered entity or business associate must implement
      technical policies and procedures for electronic information
      systems that maintain electronic protected health information
      to allow access only to those persons or software programs
      that have been granted access rights.

      Required implementation specifications:
      - Unique User Identification — assign a unique name or number
        for identifying and tracking user identity.
      - Emergency Access Procedure — establish procedures for
        obtaining necessary PHI during an emergency.

      Addressable implementation specifications:
      - Automatic Logoff — implement electronic procedures that
        terminate an electronic session after a predetermined time
        of inactivity.
      - Encryption and Decryption — implement a mechanism to
        encrypt and decrypt electronic PHI.

      ## 164.312(b) — Audit Controls

      Implement hardware, software, and/or procedural mechanisms
      that record and examine activity in information systems
      that contain or use electronic PHI.

      ## 164.312(c) — Integrity

      Implement policies and procedures to protect electronic PHI
      from improper alteration or destruction.

      ## 164.312(d) — Person or Entity Authentication

      Implement procedures to verify that a person or entity
      seeking access to electronic PHI is the one claimed.

      ## 164.312(e) — Transmission Security

      Implement technical security measures to guard against
      unauthorized access to electronic PHI that is being
      transmitted over an electronic communications network.

      Addressable implementation specifications:
      - Integrity Controls — implement security measures to ensure
        that electronically transmitted PHI is not improperly
        modified without detection until disposed of.
      - Encryption — implement a mechanism to encrypt electronic
        PHI whenever deemed appropriate.

      ## Interpretive Note (MDS Legal)

      The Security Rule encryption specifications are "addressable"
      rather than "required," which means a covered entity must
      assess whether encryption is a reasonable and appropriate
      safeguard in its environment. In practice, modern HHS
      enforcement posture treats encryption as a presumptive
      expectation for PHI in transit and at rest; the specific
      algorithmic standards considered sufficient for the
      Encryption Safe Harbor are addressed in MDS-REG-004.

  - id: reg-hipaa-breach-notification
    title: "MDS-REG-002 — HIPAA Breach Notification Rule (Federal)"
    tokenCount: 780
    content: |
      # MDS-REG-002 — HIPAA Breach Notification Rule (Federal Summary)
      **Scope:** 45 CFR Part 164, Subpart D
      **Maintained by:** Legal & Compliance
      **Last reviewed:** 2025-11-20

      This document summarizes the federal HIPAA Breach Notification
      Rule as it applies to MDS in its capacity as a Business
      Associate. State-specific variations that impose stricter
      timelines or additional notification obligations are tracked
      separately in MDS-REG-003.

      ## Triggering Event

      A "breach" under 45 CFR 164.402 means the acquisition, access,
      use, or disclosure of PHI in a manner not permitted under the
      Privacy Rule which compromises the security or privacy of
      the PHI. A breach is presumed unless the covered entity or
      business associate demonstrates that there is a low probability
      that the PHI has been compromised based on a risk assessment
      considering:

      - The nature and extent of the PHI involved
      - The unauthorized person who used the PHI or to whom the
        disclosure was made
      - Whether the PHI was actually acquired or viewed
      - The extent to which the risk to the PHI has been mitigated

      ## Business Associate Notification (164.410)

      Following the discovery of a breach of unsecured PHI, a
      business associate shall, without unreasonable delay and
      in no case later than 60 calendar days after discovery of
      the breach, notify the covered entity of the breach. The
      notification shall identify each individual whose PHI has
      been, or is reasonably believed to have been, accessed,
      acquired, used, or disclosed during the breach.

      ## Covered Entity Notification Obligations (164.404 / 164.408)

      - **Individuals.** Without unreasonable delay and in no case
        later than 60 calendar days from discovery.
      - **HHS Secretary.** Breaches affecting 500 or more
        individuals: contemporaneously with individual notification.
        Breaches affecting fewer than 500: annual log filing.
      - **Media.** Breaches affecting 500 or more individuals in
        a single state or jurisdiction: prominent media outlets
        serving the affected area, without unreasonable delay and
        in no case later than 60 calendar days after discovery.

      ## Encryption Safe Harbor

      Under the HITECH Act, PHI that has been encrypted in
      accordance with HHS guidance is "secured" and therefore
      not subject to these notification requirements even if
      acquired by an unauthorized party. See MDS-REG-004 for the
      operative guidance.

      ## MDS Compliance Note

      MDS's internal 72-hour regulator notification commitment
      (per MDS-POL-004 Section 4) is more aggressive than the
      federal 60-calendar-day ceiling and is intended to provide
      schedule margin against the federal requirement. **Legal &
      Compliance must separately track any applicable state-law
      breach notification requirements that impose shorter
      timelines than the federal rule.**

  - id: reg-state-breach
    title: "MDS-REG-003 — State Breach Notification Requirements (Applicable Jurisdictions)"
    tokenCount: 820
    content: |
      # MDS-REG-003 — State Breach Notification Requirements
      **Scope:** Jurisdictions where MDS processes PHI on behalf of
      covered entities
      **Maintained by:** Legal & Compliance
      **Last reviewed:** 2026-01-05

      This document tracks state-law breach notification
      requirements that may apply in addition to the federal HIPAA
      Breach Notification Rule (MDS-REG-002). Where a state
      requirement is stricter than the federal rule, MDS must
      comply with the stricter requirement.

      ## Covered Jurisdictions

      MDS currently processes PHI for covered entities operating
      in the following jurisdictions. The list is updated as the
      customer portfolio changes.

      | State | Statute Reference              | Notification Ceiling |
      |-------|--------------------------------|----------------------|
      | CA    | Cal. Civ. Code 1798.82         | Expedient and without unreasonable delay |
      | NY    | NY Gen. Bus. Law 899-aa        | Expedient and without unreasonable delay |
      | TX    | Tex. Bus. & Com. Code 521.053  | Not later than 60 days after discovery |
      | IL    | 815 ILCS 530/10                | Not later than 45 days after discovery |
      | MA    | M.G.L. c. 93H § 3              | As soon as practicable and without unreasonable delay |
      | **NJ**| **N.J.S.A. 56:8-163.11 (2025 amendment)** | **Not later than 60 hours after confirmation of unauthorized access to protected health information** |
      | FL    | Fla. Stat. 501.171             | Not later than 30 days after discovery |
      | WA    | RCW 19.255.010                 | Not later than 30 days after discovery |

      ## Note on the New Jersey Requirement

      The New Jersey Protected Health Information Breach Response
      Amendment, effective 2025-07-01, imposes a 60-hour notification
      deadline running from the point at which the responsible
      business associate confirms unauthorized access to PHI. This
      is materially shorter than both the federal 60-calendar-day
      ceiling and any other state ceiling on the above list. Legal &
      Compliance has flagged that MDS currently holds BAAs with three
      New Jersey-based covered entities (Trenton Memorial Health
      Network, Camden Pediatric Partners, and Hudson Valley Clinical
      Labs) and therefore the 60-hour deadline is operative for any
      incident touching data processed on their behalf.

      Legal & Compliance opened ticket COMP-2025-441 on 2025-08-12
      to review whether the incident-response procedures, customer
      notification playbooks, and control-library references used by
      MDS fully reflect the new New Jersey timeline; ticket status as
      of this document's review is "open, awaiting policy revision."

      ## General Drafting Guidance

      Where a BAA with a covered entity imposes a notification
      timeline stricter than any applicable state or federal law,
      the BAA timeline governs as a contractual matter even though
      it does not change the statutory ceiling.

  - id: reg-hhs-encryption
    title: "MDS-REG-004 — HHS Encryption Safe Harbor Guidance"
    tokenCount: 720
    content: |
      # MDS-REG-004 — HHS Guidance on Encryption Safe Harbor
      **Scope:** HHS Guidance under 42 U.S.C. 17932(h)(2)
      **Maintained by:** Legal & Compliance
      **Last reviewed:** 2025-11-20

      This document summarizes the operative HHS guidance specifying
      the encryption standards under which PHI is deemed "secured"
      and therefore exempt from breach notification obligations
      under the HITECH Act.

      ## Background

      Section 13402(h)(2) of the HITECH Act directs the Secretary of
      HHS to issue annual guidance specifying the technologies and
      methodologies that render PHI unusable, unreadable, or
      indecipherable to unauthorized individuals. The original
      guidance was issued in 2009 and has been updated periodically;
      the operative version as of this document's review date
      incorporates the 2023 update reflecting current NIST
      recommendations.

      ## Encryption Standards Specified

      The HHS guidance deems PHI "secured" when it has been encrypted
      as specified in the applicable NIST publication, as follows:

      - **Data at rest.** Encryption consistent with NIST SP 800-111,
        "Guide to Storage Encryption Technologies for End User
        Devices." The 2023 update clarifies that, as of the current
        NIST recommendation, this means the use of FIPS-validated
        Advanced Encryption Standard (AES) with a minimum key length
        of **256 bits** for PHI at rest.
      - **Data in motion.** Encryption consistent with, as
        appropriate, NIST SP 800-52, NIST SP 800-77, NIST SP 800-113,
        or others which are FIPS 140-2 validated. The 2023 update
        clarifies that acceptable cipher suites must provide a
        minimum symmetric strength of **AES-256** for PHI in transit
        where the transmitting system is under the control of the
        covered entity or business associate.

      ## Enforcement Posture

      The HHS Office for Civil Rights (OCR) has taken the position
      in recent enforcement actions that reliance on sub-256-bit
      AES cipher suites for PHI in transit, absent a documented
      compensating control, does not satisfy the Safe Harbor even
      where the cipher suite is technically permitted by the
      underlying NIST publication. MDS Legal has advised that any
      production system handling PHI in transit with an AES-128
      or weaker cipher suite should be treated as outside the
      Safe Harbor for purposes of breach-notification analysis.

      ## Compliance Mapping for MDS

      Control owners should align MDS transport-security standards to
      the 256-bit minimum reflected above. Legal has opened ticket
      COMP-2025-362 to track a broader review of internal encryption
      references that still cite pre-2023 guidance.

  - id: audit-soc2
    title: "MDS-AUD-001 — SOC 2 Type II External Audit — Summary Report"
    tokenCount: 820
    content: |
      # MDS-AUD-001 — SOC 2 Type II External Audit Summary
      **Auditor:** Aldridge & Whitman CPA LLP
      **Period covered:** 2024-11-01 through 2025-10-31
      **Report issued:** 2025-12-18
      **Trust Services Criteria:** Security, Availability, Confidentiality

      ## Opinion

      In our opinion, in all material respects, the description
      presents the service organization's system that was designed
      and implemented throughout the specified period, and the
      controls related to the applicable trust services criteria
      were suitably designed and operating effectively to provide
      reasonable assurance that the service commitments and system
      requirements would be achieved, based on the applicable
      trust services criteria, subject to the matters described
      in the "Exceptions Noted" section below.

      ## Scope of Testing

      We performed testing on 42 controls across the three trust
      services categories in scope. Test procedures included
      inquiry, observation, inspection of evidence, and
      re-performance where applicable. The test of details
      covered a stratified sample of transactions, access events,
      and administrative actions from the period.

      ## Exceptions Noted

      Three exceptions were noted during the period:

      1. **Access review timeliness.** Three of 24 tested quarterly
         access reviews were completed more than 10 business days
         after the scheduled due date. Management attributed this
         to staffing gaps during the July-August 2025 vacation
         period and has implemented an automated reminder cadence.
         Impact: Low. Management remediation accepted.

      2. **Change management — emergency change documentation.**
         Two of 18 tested emergency changes were not accompanied
         by post-change documentation within the 48-hour window
         required by MDS-POL-007. In both cases the change itself
         was appropriate and was subsequently documented. Impact:
         Low. Management remediation accepted.

      3. **Vendor onboarding evidence.** For one of 12 vendor
         onboardings tested, the signed Business Associate
         Agreement and the completed security questionnaire were
         filed in the vendor risk management system 17 days after
         the first data exchange. Impact: Medium. Management
         remediation accepted.

      ## Areas Not in Scope

      This report does not address the adequacy of MDS's controls
      with respect to the substantive requirements of the HIPAA
      Security Rule beyond the Trust Services Criteria mapping.
      HIPAA-specific matters identified during the engagement that
      were not within the SOC 2 scope have been communicated to
      management under separate cover (the "Management Letter")
      and are tracked in the MDS compliance register.

      ## Management's Response

      Management has accepted the exceptions noted above and
      committed to remediation plans targeting Q1 2026 completion.

  - id: audit-pentest
    title: "MDS-AUD-002 — External Penetration Test Report (Q4 2025)"
    tokenCount: 890
    content: |
      # MDS-AUD-002 — External Penetration Test Report
      **Tester:** Cobalt Ridge Offensive Security
      **Engagement period:** 2025-10-06 through 2025-10-31
      **Scope:** External network, public APIs, customer-facing web
      app, authentication infrastructure
      **Methodology:** OWASP ASVS L2 + PTES

      ## Executive Summary

      Cobalt Ridge conducted a four-week external penetration test
      against the MDS production environment. No critical- or
      high-severity findings were identified that would allow an
      unauthenticated attacker to access PHI. Three medium-severity
      findings and seven low-severity findings were identified and
      are detailed below. All findings have been reported to MDS
      Security Engineering for remediation tracking.

      ## Medium-Severity Findings

      ### M-01 — Customer API TLS Configuration

      The public customer-facing API endpoint (api.mds.health)
      advertises a cipher suite selection in which AES-128-GCM is
      the negotiated default for clients that do not explicitly
      prefer AES-256. Observed during the engagement with a
      representative sampling of client user agents; the negotiated
      cipher was AES_128_GCM_SHA256 in 94% of handshakes. This
      endpoint handles PHI in transit as part of the customer
      ingestion flow. While AES-128-GCM is not a cryptographic
      weakness per se, it is below the stricter 256-bit
      configuration MDS Security Engineering has been moving
      toward for PHI-bearing endpoints. Recommendation:
      reconfigure the load balancer cipher preference to enforce
      AES-256-GCM as the default and remove AES-128-GCM from the
      accepted list for PHI-bearing endpoints. Internal standards
      and external guidance should be reviewed before rollout.

      ### M-02 — Session Cookie Scope

      The customer portal session cookie does not set the
      `__Host-` prefix and is scoped to a parent domain. A
      subdomain takeover in an unrelated marketing property
      could allow session cookie theft. Recommendation: migrate
      session cookies to `__Host-` scope.

      ### M-03 — Error Message Disclosure

      Several API error responses include stack traces with
      internal module paths when the `Accept: application/json`
      header is absent. Recommendation: sanitize error responses
      at the gateway.

      ## Low-Severity Findings (summary)

      L-01 through L-07: various informational items including
      missing security headers on a marketing page, overly
      permissive CORS on a metrics endpoint, and verbose HTTP
      banner strings. Full detail in Appendix A.

      ## Items Outside Scope

      The internal production network, the break-glass clinical
      access workflow, and the backup-restoration procedures
      were not within this engagement's scope and are covered
      by other audit activities.

  - id: audit-access-control
    title: "MDS-AUD-003 — Access Control Audit (Internal, Q4 2025)"
    tokenCount: 860
    content: |
      # MDS-AUD-003 — Access Control Audit
      **Auditor:** MDS Internal Audit (Stephanie Marquez, CIA)
      **Period covered:** 2025-05-01 through 2025-10-31 (6 months)
      **Report issued:** 2025-12-02

      ## Objective

      Evaluate the design and operating effectiveness of access
      controls for systems containing PHI against the requirements
      of MDS-POL-003 (Access Control & Authentication Policy) and
      the HIPAA Security Rule access control standard.

      ## Scope

      The audit covered nine in-scope systems: the clinical data
      warehouse, the ingestion API cluster, the customer portal,
      the internal administrative console, the SIEM, the
      identity provider, the break-glass gateway, the backup
      orchestrator, and the data export service.

      ## Procedures Performed

      - Reviewed RBAC role definitions for all nine systems
      - Re-performed quarterly access reviews for a sample of 30
        workforce members (of 284)
      - Inspected authentication event logs for a stratified
        sample of 1,200 PHI access events
      - Inspected break-glass access logs for the full period
      - Interviewed system owners and the identity team

      ## Findings

      ### AF-01 — Break-Glass Access Invocations

      The break-glass clinical access workflow allows authorized
      emergency responders to access clinical data through a
      dedicated emergency path that does not traverse the same
      secondary-authentication challenge used in the standard
      workflow. Break-glass invocations are logged to the SIEM
      and reviewed after the fact as part of the emergency-access
      process.

      During the audit period we observed **14 break-glass
      invocations** originating from five distinct user accounts.
      Each invocation carried an approved operational ticket;
      each was for a Sev-1 clinical incident in which immediate
      data access was operationally necessary. No break-glass
      invocation resulted in PHI exfiltration or unauthorized
      disclosure — the workflow appears to be used as intended.

      Internal Audit was not provided a formal exception memo or
      control standard describing how the emergency path should be
      documented relative to the standard authentication flow.
      Either the exception should be formally documented in MDS
      control artifacts, or the workflow should be reengineered to
      include a compliant second factor (for example, pre-
      provisioned hardware tokens held by emergency responders).

      **Recommendation.** Open a policy exception request with
      the CISO and the Compliance Committee. Amend MDS-POL-003
      Section 2 to reflect the break-glass workflow or implement
      a compliant second factor by 2026-Q2.

      ### AF-02 — Quarterly Access Review Timeliness

      Consistent with the SOC 2 audit (MDS-AUD-001), three of
      the nine systems were subject to one late quarterly access
      review during the period. No material access inappropriate
      to role was identified on re-performance.

      ### AF-03 — Orphaned Service Accounts

      Four service accounts with PHI read permission were
      identified as having no owner of record following
      organizational changes in Q3 2025. All four were
      deprovisioned during the audit.

  - id: audit-incident-response
    title: "MDS-AUD-004 — Incident Response Process Audit (Q4 2025)"
    tokenCount: 820
    content: |
      # MDS-AUD-004 — Incident Response Process Audit
      **Auditor:** MDS Internal Audit (Jaime Okafor, CISA)
      **Period covered:** 2025-Q4 (2025-10-01 through 2025-12-31)
      **Report issued:** 2026-01-22

      ## Objective

      Evaluate the operating effectiveness of the MDS Incident
      Response process as documented in MDS-POL-004 against the
      response and containment service-level commitments stated
      in Section 3 of that policy.

      ## Scope

      All Sev-1 and Sev-2 incidents opened during the audit
      period were included. Sev-3 and Sev-4 incidents were
      reviewed on a sampling basis.

      ## Procedures Performed

      - Extracted the full incident roster from the IR tracking
        system (31 incidents in period: 6 Sev-1, 11 Sev-2,
        9 Sev-3, 5 Sev-4)
      - Matched each incident to its response-time metrics
      - Interviewed the on-call incident commanders
      - Reviewed post-incident retrospectives for all Sev-1 and
        Sev-2 incidents

      ## Findings

      ### IRF-01 — Sev-1 Initial Response Time

      Our test of details on the six Sev-1 incidents in the
      period found the following measured response times from
      incident-opened timestamp to incident-commander-assigned
      timestamp:

      | Incident   | Opened           | IC Assigned      | Elapsed |
      |------------|------------------|------------------|---------|
      | IR-2025-187 | 2025-10-03 02:14 | 2025-10-03 09:41 | 7h 27m  |
      | IR-2025-201 | 2025-10-19 11:22 | 2025-10-19 14:10 | 2h 48m  |
      | IR-2025-214 | 2025-11-08 04:06 | 2025-11-08 14:22 | 10h 16m |
      | IR-2025-229 | 2025-11-27 18:44 | 2025-11-28 04:10 | 9h 26m  |
      | IR-2025-238 | 2025-12-10 21:03 | 2025-12-11 02:17 | 5h 14m  |
      | IR-2025-245 | 2025-12-22 15:01 | 2025-12-22 20:40 | 5h 39m  |

      **Measured average initial response: 6h 49m.** The arithmetic
      mean across the six incidents comes to 6 hours 49 minutes
      (409 minutes). Including the three Sev-1 incidents from
      Q3 2025 (retrieved for trend analysis), the trailing
      nine-incident average is **7.5 hours**.

      Only one of the six Sev-1 incidents in the audit period
      (IR-2025-201) met the internal target documented for the
      program. The primary driver of the variance is overnight
      on-call handoff latency for incidents opened between
      22:00 and 06:00 local time.

      **Recommendation.** Either (a) revise the documented Sev-1
      target to reflect achievable performance given current
      staffing, or (b) invest in 24/7 on-call staffing to meet
      that target. The current divergence between documented and
      actual performance is a material control finding.

      ### IRF-02 — Containment Target Achievement

      Sev-1 containment targets (24 hours per policy) were met
      in all six cases. Sev-2 containment targets (72 hours)
      were met in 10 of 11 cases.

      ### IRF-03 — Post-Incident Review Completion

      All six Sev-1 retrospectives were completed within the
      30-day window required by MDS-POL-004 Section 5. One
      Sev-2 retrospective was completed 8 days late.

  - id: incident-hx-2025-07
    title: "MDS-INC-001 — Incident HX-2025-07 — MedScribe Forensic Hold"
    tokenCount: 820
    content: |
      # MDS-INC-001 — Incident Record HX-2025-07
      **Severity:** Sev-2 (High)
      **Status:** Closed
      **Opened:** 2025-08-14 10:32 UTC
      **Closed:** 2025-11-12 16:18 UTC (90-day duration)
      **Incident Commander:** Priya Chandrasekaran

      ## Summary

      On 2025-08-14, the MDS detection platform flagged anomalous
      query patterns originating from a MedScribe Inc. service
      account against the clinical data warehouse. MedScribe is
      an MDS vendor providing medical transcription services;
      the service account is used by MedScribe's production
      pipeline to ingest transcription outputs into the
      warehouse under the terms of the MedScribe BAA (see
      MDS-VEN-001).

      Initial triage determined that the anomalous queries were
      not associated with unauthorized PHI acquisition — the
      queries were legitimate operations issued by a new
      MedScribe microservice during a deployment. No PHI was
      acquired outside the scope of the BAA. However, the
      anomaly triggered a forensic hold on the MedScribe data
      ingestion pipeline pending full investigation and
      confirmation that no PHI was accessed outside the
      contracted scope.

      ## Forensic Hold Scope

      In coordination with MedScribe's incident response team
      and MDS Legal, a forensic data hold was placed on all
      MedScribe-processed PHI held in MDS systems during the
      investigation period. The hold preserved:

      - The full MedScribe ingestion pipeline logs
      - Query audit logs from the clinical data warehouse for
        all MedScribe service account activity
      - The raw transcription outputs ingested during the
        seven-day period preceding the anomaly
      - Derived clinical records that referenced any transcription
        processed by MedScribe during the preservation window

      ## Retention Deviation

      The forensic hold was in effect for the full incident
      duration. Data that would otherwise have been deleted
      under the standard MedScribe retention workflow was
      instead held for **90 days**, from incident open on
      2025-08-14 through incident closure on 2025-11-12. At
      closure, the held data was purged in accordance with the
      standard retention schedule.

      MDS Legal's position is that the forensic hold was
      necessary and appropriate given the nature of the
      anomaly, but the BAA amendment process was not initiated
      and the MedScribe vendor relationship manager was
      notified of the hold by email on 2025-08-15 without a
      formal BAA amendment. The incident retrospective (not
      in this document) flagged the absence of a formal BAA
      amendment as a process gap.

      ## Root Cause and Remediation

      Root cause: MedScribe deployed a new batching microservice
      on 2025-08-13 that issued queries outside the pattern
      expected by the MDS detection rules. The microservice was
      within the scope of the BAA but was not communicated to
      MDS in advance. Remediation: MedScribe committed to
      notifying MDS of future microservice deployments in
      writing at least 48 hours in advance.

