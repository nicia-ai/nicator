      (42 CFR 493.1105). MDS acknowledges that the CLIA
      retention period for clinical test results may exceed
      the maximum retention MDS would otherwise specify, and
      that the CLIA requirement governs to the extent of any
      conflict.

      ## Section 7 — Breach Notification

      TrueNorth shall notify MDS of any breach of unsecured
      PHI within 24 hours of discovery.

      ## Section 8 — Subcontractors

      TrueNorth shall not engage a subcontractor to perform
      services involving PHI under this Agreement without
      the prior written consent of MDS. TrueNorth's current
      list of approved subcontractors is maintained in
      Exhibit C and updated quarterly.

