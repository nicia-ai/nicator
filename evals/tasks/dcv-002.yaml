    title: "MDS-INC-004 — Post-Incident Review Template and Register"
    tokenCount: 640
    content: |
      # MDS-INC-004 — Post-Incident Review Template and Register
      **Owner:** Incident Response Team
      **Version:** 3.0

      ## Purpose

      This document defines the standard post-incident review
      ("PIR") structure used for all Sev-1 and Sev-2 incidents
      at MeridianHealth Data Systems, and serves as the
      register pointing to completed PIRs for the current
      calendar year.

      ## PIR Structure

      Each PIR follows a six-section format:

      1. **Incident summary.** One-paragraph description of
         what happened, when it was detected, and when it
         was contained.
      2. **Impact.** PHI implications, customer impact,
         clinical workflow impact, financial impact.
      3. **Timeline.** Ordered log of detection, escalation,
         containment, eradication, recovery.
      4. **Root cause.** Technical and organizational factors.
      5. **Remediation actions.** What has been done and what
         is still pending, with owners and due dates.
      6. **Process improvements.** Findings that generalize
         beyond the specific incident, tracked in the IR
         process improvement register.

      ## 2025 Completed PIRs

      | Incident     | Severity | PIR Completed |
      |--------------|----------|----------------|
      | IR-2025-018  | Sev-1    | 2025-02-14     |
      | IR-2025-047  | Sev-2    | 2025-04-01     |
