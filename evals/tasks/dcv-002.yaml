  - id: vendor-medscribe
    title: "MDS-VEN-001 — MedScribe Inc. Business Associate Agreement (Excerpt)"
    tokenCount: 840
    content: |
      # MDS-VEN-001 — MedScribe Inc. Business Associate Agreement
      **Contracting parties:** MeridianHealth Data Systems, Inc.
      (MDS) and MedScribe Inc.
      **Effective date:** 2024-06-01
      **Term:** 3 years, auto-renewing 1-year terms
      **BAA type:** Downstream — MedScribe acts as a
      subcontractor Business Associate to MDS

      This excerpt presents selected sections relevant to the
      audit scope; the full agreement is maintained by MDS
      Legal in the contracts repository.

      ## Section 4 — Permitted Uses and Disclosures

      MedScribe shall use and disclose PHI only as necessary
      to perform the transcription services described in
      Exhibit A, and only as permitted by the HIPAA Privacy
      Rule applicable to MedScribe's status as a Business
      Associate of MDS. MedScribe shall not sell PHI and
      shall not use PHI for marketing purposes.

      ## Section 5 — Safeguards

      MedScribe shall implement administrative, physical, and
      technical safeguards that reasonably and appropriately
      protect the confidentiality, integrity, and availability
      of PHI, consistent with the HIPAA Security Rule.
      MedScribe shall encrypt PHI in transit and at rest using
      industry-standard encryption meeting or exceeding the
      standards specified in MDS-POL-002.

      ## Section 6 — Data Retention

      **MedScribe shall retain PHI only for the minimum period
      necessary to perform the services, and in no event
      longer than 30 days from the date of ingestion of the
      transcription output into MDS systems.** After the
      30-day retention period, MedScribe shall purge the PHI
      from all MedScribe-controlled systems, including
      primary storage, caches, logs, and backups, and shall
      provide MDS with a written certification of purge on
      request.

      The 30-day retention limit is absolute. No operational
      circumstance within MedScribe's control justifies
      retention beyond 30 days without a written amendment
      to this Agreement executed by both parties.

      ## Section 7 — Breach Notification

      MedScribe shall notify MDS of any breach of unsecured
      PHI within 24 hours of discovery, in writing, at the
      MDS Privacy Office email address listed in Exhibit B.
      The notification shall include the information required
      by 45 CFR 164.410(c) to the extent known at the time
      of notification.

      ## Section 8 — Amendments

      This Agreement may be amended only by a writing signed
      by authorized representatives of both parties. No oral
      amendment is effective. No course of dealing between
      the parties shall be construed as modifying the terms
      of this Agreement.

      ## Section 9 — Termination for Cause

      MDS may terminate this Agreement for cause upon written
      notice if MedScribe (a) materially breaches a provision
      of this Agreement and fails to cure within 30 days of
      notice, (b) becomes unable to perform the services, or
      (c) experiences a reportable breach of PHI with a
      material impact on MDS's covered-entity customers.

  - id: vendor-careconnect
    title: "MDS-VEN-002 — CareConnect Systems SOC 2 Type II Summary (Vendor-Provided)"
    tokenCount: 840
    content: |
      # MDS-VEN-002 — CareConnect Systems SOC 2 Type II Summary
      **Vendor:** CareConnect Systems, Inc.
      **SOC 2 auditor:** Nevins & Holtzmann LLP
      **Period covered:** 2024-10-01 through 2025-09-30
      **Report distributed to:** MDS Vendor Risk Management
      **Note:** This summary is prepared by MDS Vendor Risk
      from the full CareConnect SOC 2 Type II report, which
      is available on request under NDA.

      ## Service Provided to MDS

      CareConnect provides the emergency clinical access
      workflow ("break-glass gateway") integrated into MDS's
      clinical data warehouse. The gateway allows authorized
      emergency responders at MDS's covered-entity customers
      to retrieve clinical data in time-critical situations
      when the standard access workflow (MDS-POL-003) would
      introduce unacceptable latency.

      ## Relevant Control Summary

      ### CC6.1 — Logical Access Controls

      CareConnect's logical access controls for standard
      workflows require multi-factor authentication using a
      FIDO2 security key or TOTP second factor. The controls
      are designed and operating effectively for standard
      access paths across the audit period.

      ### CC6.1-E — Emergency Access Exception

      CareConnect operates a break-glass procedure for
      emergency clinical access that bypasses the secondary
      authentication factor required for standard workflows.
      The break-glass procedure is invoked from a dedicated
      endpoint with the following compensating controls:

      - Primary-factor authentication (password) is required
      - The invoking user's identity is established via an
        approved operational ticket
      - The invocation is logged in real time to both the
        CareConnect audit log and the MDS SIEM
      - A post-hoc review is performed by a CareConnect
        compliance analyst within 24 hours
      - Invocation requires an explicit human-readable
        justification string that is retained with the log
        record

      The auditor observed that the break-glass procedure is
      designed as described and is operating effectively.
      Break-glass invocations during the audit period were
      sampled and the compensating controls were present in
      all sampled cases.

      **MDS Vendor Risk note:** The break-glass bypass is a
      deliberate product behavior and is disclosed to customers.
      MDS Vendor Risk has requested clarification on how the
      workflow should be documented in MDS control artifacts.
      Resolution is pending a customer-facing documentation
      update or a compliant second-factor implementation.

      ### CC7.1 — System Monitoring

      CareConnect performs 24x7 monitoring of the break-glass
      gateway. No unauthorized invocations were detected
      during the audit period.

