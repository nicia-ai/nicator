inputArtifacts:
  - id: doc-cim
    title: "Ridgewave Systems — Confidential Information Memorandum (Seller)"
    tokenCount: 520
    content: |
      # Ridgewave Systems — Confidential Information Memorandum

      **Prepared for: Qualified Acquirers | February 2026**
      **Advisor: Meridian Capital Partners**

      ## Executive Summary

      Ridgewave Systems is a leading cloud-native observability platform
      serving mid-market enterprises in North America and EMEA. Founded
      in 2017, the company has grown to serve over 340 paying customers
      with industry-leading retention and a best-in-class product
      velocity profile.

      ## Key Financial Highlights (FY2025)

      - **Annual Recurring Revenue (ARR): $31.2M** at 12/31/2025, up
        from $24.0M at 12/31/2024
      - **YoY ARR growth: 30%** — consistent with prior two years
      - **Net Dollar Retention (NDR): 115%** — best-in-class for our
        segment
      - **Gross margin: 78%** — reflecting mature unit economics
      - **Sales payback period: under 18 months** — top-quartile
        performance
      - **Customer count: 340+** — no single customer represents more
        than 15% of ARR

      ## Growth Trajectory

      Management projects $42M ARR by 12/31/2026, driven by continued
      land-and-expand motion and expanding EMEA presence. FY2026
      bookings pipeline stands at $21M weighted, representing 1.4x
      coverage against the $15M new-logo target implied by the plan.

      ## Strategic Rationale

      Ridgewave is offered to strategic and financial acquirers with
      the operational muscle to scale its enterprise motion. The
      business is at an inflection point: the product is mature, the
      go-to-market motion is proven, and the market opportunity is
      expanding faster than we can currently address.

  - id: doc-qoe
    title: "Ridgewave Systems — Quality of Earnings Report (Independent)"
    tokenCount: 540
    content: |
      # Quality of Earnings Report — Ridgewave Systems Inc.

      **Prepared by: Haverford Grant LLP**
      **Engagement: Buy-side QoE for EverPeak Capital**
      **Scope: FY2024 and FY2025, limited-scope transaction diligence**

      ## Summary of Findings

      We reviewed Ridgewave's trial balance, revenue contracts, and
      management reporting for the two-year period ending 12/31/2025.
      Our findings materially reconcile to management's reported ARR
      figure with adjustments noted below.

      ## ARR Reconciliation

      Management reports FY2025 ending ARR of $31.2M. After the
      adjustments listed in Appendix A, we arrive at an adjusted ARR of
      **$29.4M**. The $1.8M reduction is driven by:

      - Reclassification of three one-time professional services
        contracts originally booked as recurring ($0.9M)
      - Removal of two contracts in active dispute for which collection
        is not reasonably assured ($0.6M)
      - Haircut on a stub-period multi-year contract where year-one
        revenue was over-recognized under the company's policy ($0.3M)

      Applying the same adjustments to the FY2024 ending balance yields
      **$24.1M adjusted** (vs. $24.0M management). Adjusted YoY growth
      is therefore **22%**, not the 30% figure management uses in its
      marketing materials. We consider the 22% figure to be the more
      faithful representation of organic growth.

      ## Customer Concentration (Appendix C, summarized)

      The largest customer by contracting entity represents **18.0%**
      of adjusted FY2025 ARR. When associated entities are rolled up
      to beneficial owner (the customer's corporate parent controls
      three contracting subsidiaries that management reports as distinct
      logos), the effective concentration rises to **24.1%**.

      We flag this for the acquirer because management's CIM asserts
      that no customer represents more than 15% of ARR, which is true
      only under the narrowest contracting-entity view.

