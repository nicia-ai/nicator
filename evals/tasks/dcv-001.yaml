      # Executive Compensation & Earn-Out Schedule
      ## Ridgewave Systems Inc. — Transaction Terms
      ## Reference document for EverPeak Capital negotiation team

      ## Founders' Earn-Out

      CEO Diana Marsh and CFO Marcus Thornton are entitled to a
      combined earn-out equity allocation triggered by FY2026 ARR
      performance. The earn-out structure:

      | Tier | ARR Achievement | Earn-out Shares |
      |------|-----------------|------------------|
      | 1    | Base            | 200,000          |
      | 2    | **$30M or 130% of 2024 ARR** (whichever is higher) | +100,000 |
      | 3    | $35M or 150% of 2024 ARR (whichever is higher)    | +150,000 |

