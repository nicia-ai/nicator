      # FY2026 Sales Pipeline & Forecast
      ## As of October 31, 2025
      ## Internal — Sales Operations

      ## Headline Numbers

      - **Total weighted pipeline:** $21.0M
      - **New-logo ARR target:** $15.0M
      - **Pipeline coverage:** 1.4x

      ## Conversion Assumptions

      Forecast weighting assumes **35% win rate** on Stage-3+
      opportunities, consistent with historical average. This is used
      to derive the weighted pipeline figure above.

      ## Historical Win Rate by Quarter (Stage-3+ at period start)

      | Period | Win Rate |
      |--------|----------|
      | Q1 FY2024 |  28%   |
      | Q2 FY2024 |  31%   |
      | Q3 FY2024 |  26%   |
      | Q4 FY2024 |  22%   |
      | Q1 FY2025 |  25%   |
      | Q2 FY2025 |  27%   |

      **Trailing-6Q average: 26.5%**

      The 35% figure in the forecast reflects "expected improvement as
      enterprise rep ramp completes." Sales Ops has flagged that the
      25-27% range is the more defensible assumption absent a concrete
      driver of improvement.

