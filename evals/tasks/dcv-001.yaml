      # Ridgewave Systems — Business Review
      ## For: Prospective Acquirers
      ## Date: October 2025

      ---

      ## Slide 1: The Ridgewave Story

      - 340+ enterprise customers
      - $30M+ ARR run-rate
      - 115% NDR
      - Mature product, experienced leadership, mature GTM

      ---

      ## Slide 2: Customer Success Metrics

      **Retention is our North Star.**

      - Net Dollar Retention: **115%**
      - Gross logo retention: **97.5%** (weighted by ARR)
      - Logo churn: **2.5%** (measured on ARR-weighted basis)
      - Top-20 customer renewal: **100%** — every top-20 customer
        renewed in the prior 12 months

      ---

      ## Slide 3: Why We Win

      Our customer obsession is reflected in the numbers. The top 20
      accounts — which represent over 50% of ARR — have a 100% renewal
      rate over the last 12 months. This is the foundation of our
      115% NDR and the reason we believe Ridgewave's commercial model
      is durable through an economic cycle.

      ---

      ## Slide 4: FY2026 Plan

      - **ARR target: $42M** (management base case)
      - **New-logo target: 120 accounts** (implied $15M new ARR)
      - **Expansion target: $4M from existing base**
      - **Implied churn: $8.2M** (but see Slide 2: "churn is under
        control")
      - **FY2026 pipeline coverage: 1.4x** on new-logo target
      - **Projected sales payback: 16 months** — improving from
        FY2025's sub-18-month figure

