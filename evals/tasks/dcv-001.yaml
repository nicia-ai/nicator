  - id: doc-risk-factors
    title: "Ridgewave — Transaction Risk Factors & Disclosures"
    tokenCount: 320
    content: |
      # Risk Factors & Disclosures
      ## Ridgewave Systems Inc. — Transaction Documentation

      ## Customer Concentration

      Ridgewave's revenue profile includes a degree of customer
      concentration that the acquirer should evaluate. As disclosed in
      the customer schedule (Data Room 4.3), our largest customer
      represents approximately 18% of FY2025 ARR on a contracting-
      entity basis.

      For completeness, the largest customer's corporate parent also
      owns minority stakes in two additional logos that appear as
      separate contracts in our customer schedule. The acquirer's
      counsel should review beneficial ownership for independent
      risk assessment.

      ## Contingent Liabilities

      Two customer contracts included in the management ARR reporting
      are subject to ongoing commercial disputes. The QoE report
      (Section A-3) excludes these contracts from adjusted ARR. Total
      exposure: approximately $0.6M.

      ## Governance

      Founders retain operational control through a voting trust
      during the earn-out period. The earn-out thresholds (see
      Executive Compensation & Earn-Out Schedule) were negotiated on
      the basis of 2024 audited ARR.

question: |
  You are performing pre-signing diligence on EverPeak Capital's proposed
  acquisition of Ridgewave Systems. 10 documents have been seeded as
  artifacts in your context. Identify every material cross-source
  discrepancy — places where two or more documents disagree in a way
  that would affect valuation, earn-out calculation, covenant drafting,
  or representation & warranty scope.

  For each discrepancy:
  - Name the metric or claim
  - Cite the conflicting documents
  - State the discrepancy specifically (what each source says)
  - Flag its materiality

  Produce a ranked list of discrepancies, most material first. Do not
  include items that are consistent across sources.

referenceFacts:
  - id: fact-revenue-growth-30-vs-22
    description: >-
      CIM claims 30% YoY ARR growth; QoE adjusts to 22% after
      reclassification. Both figures or both underlying ARR figures
      ($31.2M vs $29.4M) must appear.
    canonical: "22%"
    pattern: "22%|29\\.4[Mm]|adjusted.*ARR|reclassif"
    weight: 2

  - id: fact-top20-renewal-100-vs-lapsed
    description: >-
      Management deck claims 100% top-20 renewal; customer schedule
      shows 3 lapsed top-20 accounts (Stonebridge, Meridian, Acorn).
    canonical: "100%"
    pattern: "100%.*renew|top.20.*renew|Stonebridge|Meridian|Acorn|lapsed.*top|three.*lapsed|3.*lapsed"
    weight: 2

  - id: fact-earn-out-30M-vs-30-55M
    description: >-
      Earn-out tier 2 stated as "$30M" in CIM but defined as "higher
      of $30M or 130% of 2024 ARR"; 2024 ARR is $23.5M so 130% =
      $30.55M, making the binding threshold higher than the advertised
      round number.
    canonical: "$30.55"
    pattern: "30\\.55|130%.*23\\.5|23\\.5.*130%|earn.out.*higher"
    weight: 2

  - id: fact-concentration-15-vs-18-vs-24
    description: >-
      CIM says no customer >15% of ARR; QoE and risk factors show 18%
      on contracting-entity basis and 24% on beneficial-owner basis.
    canonical: "18%"
    pattern: "18%.*concentration|18\\.0%|24%|beneficial|concentrat.*15"
    weight: 2

  - id: fact-churn-4-vs-2-5
    description: >-
      Retention analysis reports 4% cohort-exit churn; management
      deck reports 2.5% ARR-weighted churn. Methodology discrepancy.
    canonical: "4%"
    pattern: "4%.*cohort|cohort.*4%|4\\.0%.*churn|2\\.5%.*ARR|methodology|weighted"
    weight: 1

  - id: fact-pipeline-win-rate-35-vs-26
    description: >-
      Pipeline doc uses 35% win rate; historical 6Q average is 26.5%
      and board minutes note 22-27% range. Bonus finding for models
      that catch the forecast optimism.
    canonical: "35%"
    pattern: "35%.*win|win.*35%|26\\.5%|22.27%|ramp.*assumption"
    weight: 1

rubricWeights:
  faithfulness: 0.30
  completeness: 0.40
  coherence: 0.15
  actionability: 0.15

passFail:
  minFactualScore: 0.80
  requireZeroFailingStepGrades: true
  requiredFactIds:
    - fact-revenue-growth-30-vs-22
    - fact-top20-renewal-100-vs-lapsed
    - fact-earn-out-30M-vs-30-55M
    - fact-concentration-15-vs-18-vs-24
  description: >-
    Must identify all four of the core discrepancies: the revenue
    growth adjustment, the top-20 retention contradiction, the
    earn-out threshold precision, and the customer concentration
    definition gap. Missing any of these is a material diligence
    failure. The churn methodology and pipeline win-rate discrepancies
    are bonus points.

requiredSkills:
  - extract-claims

definitionOverrides:
  systemPrompt: >-
    You are a transaction diligence coordinator. Your job is to find
    every material cross-source discrepancy in a set of 10 diligence
    documents seeded as artifacts in your context.

    **Decomposition pipeline — follow this exactly.**

    **Turn 1 — Read all 10 source artifacts.**
    Call `read_artifact` in parallel once per seeded input artifact
    (10 read_artifact calls in a single turn). After this turn you
    will have the full content of each document in your tool results.

    **Turn 2 — Extract claims per document (parallel skill calls).**
    Invoke the `extract-claims` skill 10 times in parallel — once per
    document. You may split these calls across at most two turns, but
    do not emit more than five `skill` calls in a single assistant turn.
    For each call, paste the full document text from Turn 1's tool
    results directly into the skill's `task_input` (do NOT pass
    artifact_ids — extract-claims is a pure-analysis skill with no
    tool access). The task_input should contain the document content
    plus a short directive to extract quantitative facts, definitions,
    and conditional statements. Each extract-claims call produces its
    own claim artifact.

    **Turn 3 — Cross-reference (single ad-hoc agent).**
    Dispatch a single `agent` tool call with `name: "cross-referencer"`.
    Pass all 10 extracted-claim artifact_ids via `artifact_ids` (copy
    them exactly from your Completed Tasks context). The
    cross-referencer's prompt should instruct it to read each claim
    artifact via read_artifact, group claims by metric, and flag every
    case where two or more documents disagree — including definitional
    or methodology disagreements, not just different numbers. Its
    task_input should be a short directive; the real content comes
    from the claim artifacts.

    **Turn 4 — Synthesize final report (single ad-hoc agent).**
    Dispatch a single `agent` tool call with `name: "synthesizer"`,
    passing the cross-referencer's artifact_id via `artifact_ids`.
    The synthesizer's prompt should produce a ranked discrepancy
    report preserving every discrepancy the cross-referencer found,
    with a materiality flag for each.

    **Turn 5 — Final answer.**
    After the synthesizer returns, produce your final text response
    quoting the synthesized discrepancy report. No more tool calls
    after this point.

    Do not skip any stage. Do not merge stages. Do not have the
    coordinator analyze the documents itself — the decomposition
    pipeline is the thing under test.
  subagentResultMode: artifact_only
  skills:
    - name: extract-claims
      version: "1.0.0"
      policy:
        type: always
  limits:
    maxTasksPerRun: 40
    maxOperationsPerTask: 15
    maxTokensPerRun: 400000

graphAssertions:
  - type: run_status
    status: completed
    description: "Decomposition run must complete"

  - type: task_count
    match:
      subagentName: extract-claims
    min: 10
    description: "extract-claims must be invoked once per seeded document"

  - type: task_exists
    match:
      role: subagent
      subagentName: cross-referencer
    description: "cross-referencer agent must exist"

  - type: task_exists
    match:
      role: subagent
      subagentName: synthesizer
    description: "synthesizer agent must exist"

  - type: task_order
    first:
      subagentName: extract-claims
    then:
      role: subagent
      subagentName: cross-referencer
    description: "extract-claims must precede cross-referencer"

  - type: task_order
    first:
      role: subagent
      subagentName: cross-referencer
    then:
      role: subagent
      subagentName: synthesizer
    description: "cross-referencer must precede synthesizer"

  - type: consumes
    consumer:
      role: subagent
      subagentName: cross-referencer
    producer:
      subagentName: extract-claims
    description: "cross-referencer must consume extract-claims artifacts"

  - type: consumes
    consumer:
      role: subagent
      subagentName: synthesizer
    producer:
      role: subagent
      subagentName: cross-referencer
    description: "synthesizer must consume cross-referencer artifact"
