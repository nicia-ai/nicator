# DCV-001 · decomposition-value
#
# First task designed to isolate the decomposition effect. 10 documents
# on a fictional SaaS acquisition (Ridgewave Systems → EverPeak Capital)
# are seeded as input artifacts. Five cross-source discrepancies are
# planted with varying subtlety, from "different numbers for the same
# metric" (obvious) to "different computation method using the same
# underlying data" (subtle, definitional).
#
# The claim under test: a decomposition pipeline that extracts
# structured claims per document, then cross-references the extracted
# claims, finds more discrepancies than a single-pass answer from the
# same harness wrapper. The "baseline" column for this category runs
# the same harness tools/wrapper with `skills: []` and the default
# system prompt — so the delta is the decomposition effect itself,
# holding prompt and tools constant.
#
# Finding from the initial runs (claude-sonnet-4-6, April 2026):
# At this scale (10 documents × ~400 tokens each = ~4K tokens of
# dense diligence content), a single flat pass through the harness
# reliably finds all 4 required discrepancies. The decomposition
# pipeline finds the same discrepancies when it completes, but it
# has more moving parts (10 extract-claims skill calls + 2 ad-hoc
# agents) and therefore more ways to fail mid-run — so its observed
# success rate is actually lower than flat, not higher.
#
# The claim "decomposition adds value" is NOT supported by this task
# on Sonnet. To discriminate, the task needs to scale up along at
# least one axis: document length (2-3K tokens each, so total ~30K),
# document count (30+), or subtlety (discrepancies requiring
# arithmetic across 3+ sources rather than pattern-matching).
#
# Kept as starter infrastructure for step 8 — the framework plumbing
# (InputArtifact, decomposition-value category, flat-harness baseline
# comparison, extract-claims skill) all work correctly end-to-end.
# A harder variant (dcv-002+) is the next step if and when the
# "decomposition adds value" hypothesis is re-tested.

id: dcv-001
category: decomposition-value
metadata:
  purpose: mechanism
  realism: synthetic
  releaseGate: research
  comparisonMode: flat-harness
  workloadFamily: diligence-audit
  hypothesis: decomposition improves cross-source discrepancy detection on fragmented diligence packets
  stressAxes:
    - join_arity
    - decomposition_fidelity
name: Ridgewave Systems acquisition — cross-source diligence
description: >-
  10 diligence documents on a fictional SaaS acquisition. Identify every
  material discrepancy across the source documents and indicate the
  documents involved. Five discrepancies are planted with varying
  subtlety, from overt (different numbers for the same metric) to
  definitional (different computation method applied to the same data).

