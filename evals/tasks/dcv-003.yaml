# DCV-003 · decomposition-value
#
# Third decomposition-value task. This one is designed to test the
# actual thesis, not just moderate cross-document lookup.
#
# Compared with dcv-002, the pressure is increased on three axes:
#
#   - Corpus size: 11 seeded artifacts, ~27.8K estimated tokens total
#   - Arithmetic: two of the five required gaps require explicit
#     timeline or date-delta computation across 3 source documents
#   - Fidelity: no single source document summarizes any planted gap;
#     each source only states its own local facts
#
# The scenario is an FY2026 compliance audit of fictional healthcare
# claims clearinghouse Harbor Claims Exchange (HCX). The task asks for
# every material control gap where an HCX policy, an operational reality,
# a vendor practice, or a contract term diverges from an applicable
# regulatory requirement. Several documents include realistic ballast
# sections, tables, and appendices that are locally coherent but only
# become problematic once the model aligns clock start points, retention
# rules, and certificate ages across documents.
#
# Five planted gaps (all five required for pass):
#
#   1. Notification clock arithmetic (3-way): incident-intake policy
#      allows 30h from detection to materiality declaration; customer
#      notification policy allows 24h after declaration; NJ rule requires
#      notice within 48h of detection. 30h + 24h = 54h > 48h.
#
#   2. TLS certificate rotation arithmetic (2-way with date math):
#      cryptographic policy requires 90-day rotation for PHI-facing TLS
#      certs; infrastructure review dated 2026-03-31 shows PHI endpoints
#      last rotated 2025-11-18 and 2025-11-03.
#
#   3. Audit-log fidelity mismatch (3-way): control framework retains
#      full-fidelity claim-access logs for only 13 months, then keeps
#      7-year daily rollups without member/claim identifiers; regulatory
#      guidance requires full actor/member/claim/action/outcome records
#      for 7 years; infrastructure review confirms the cold archive drops
#      those identifiers after day 400.
#
#   4. MFA break-glass carveout (3-way): access policy requires MFA for
#      all PHI access with no emergency exception absent written CISO
#      approval; vendor evidence shows the emergency gateway bypasses the
#      second factor by design; access audit found 23 invocations and no
#      exception memo or register entry.
#
#   5. TranscriptPro retention overage (3-way): vendor DPA caps PHI
#      retention at 21 days absent a signed addendum; incident register
#      shows a 76-day forensic hold; contract-admin audit shows no signed
#      addendum for TranscriptPro in the review period.

