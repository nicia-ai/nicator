name: Harbor Claims Exchange audit — arithmetic cross-source control gaps
description: >-
  Eleven long compliance artifacts covering policies, regulations,
  infrastructure audits, access reviews, vendor evidence, and incident
  operations for a healthcare claims clearinghouse. Identify every
  material control gap where HCX's documented controls or operational
  reality diverge from an applicable regulatory requirement or vendor
  contract. Five planted gaps are required; two demand explicit
  arithmetic across document boundaries.

