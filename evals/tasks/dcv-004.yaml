rubricWeights:
  faithfulness: 0.40
  completeness: 0.40
  coherence: 0.10
  actionability: 0.10

passFail:
  minFactualScore: 0.80
  requireZeroFailingStepGrades: true
  description: >-
    A passing run must correctly assign every attribute to the correct
    vendor. Wrong-vendor assignment is the primary failure mode; the
    distractor material in each dossier (deprecated algorithms,
    superseded reports, aspirational regions, pilot-only SLA terms)
    is specifically designed to be confused with the authoritative
    current fact if attention is spread across all twelve vendors at
    once.

requiredSkills:
  - extract-claims
  - matrix-compiler

definitionOverrides:
  systemPrompt: >-
    You are a vendor-matrix coordinator. Twelve vendor dossiers are
    seeded as input artifacts in your context. Each dossier contains
    the authoritative current fact for four attributes plus realistic
    distractors (superseded SOC 2 reports, deprecated encryption
    tiers, aspirational regions, pilot-only breach-notification
    commitments). Your job is to produce a strict feature matrix with
    one row per vendor and exactly four attributes per row: SOC 2
    Type II status, at-rest encryption algorithm, primary data
    residency, and breach notification SLA.

    **Decomposition pipeline — follow this exactly.**

    **Phase 1 — Read every seeded dossier.**
    Call `read_artifact` in parallel once per seeded input artifact
    (12 read_artifact calls, which you may split across at most two
    turns). After this phase you must have the full text of every
    seeded dossier in tool results. Read each dossier exactly once
    unless a specific read fails and must be retried.

    **Phase 2 — Extract per-vendor claims (parallel skill calls).**
    Invoke the `extract-claims` skill exactly 12 times in parallel,
    once per vendor dossier. You may split these calls across at
    most three turns, but do not emit more than four `skill` calls
    in a single assistant turn. For each call, paste the full dossier
    text from Phase 1 directly into `task_input`. Do not batch
    multiple dossiers into one extract-claims task; each of the 12
    seeded dossiers must produce its own distinct claim artifact.
    Your short directive to each extractor must explicitly ask it to
    record, for exactly this one vendor:
    - vendor name
    - current SOC 2 Type II status (certified with date, in progress,
      expired with date, or absent)
    - exact at-rest encryption algorithm as written
    - primary data residency posture
    - breach notification SLA in hours
    and to distinguish the authoritative current fact from any older,
    deprecated, or aspirational variant mentioned in the dossier.
    Do not begin Phase 3 until all 12 extract-claims tasks have
    completed and you have 12 distinct claim artifact_ids. If you
    have fewer than 12, continue extracting before moving on.

    **Phase 3 — Compile the matrix (single skill call).**
    Dispatch exactly one `skill` call to `matrix-compiler`, passing
    all 12 extract-claims artifact_ids via `artifact_ids` and a short
    directive to produce the 12 vendor blocks in the order the
    vendors appear in the seeded input artifacts. The matrix-compiler
    must rely on the extract-claims artifacts rather than on
    coordinator memory of the dossiers. Do not dispatch the compiler
    until all 12 extract-claims subagents have completed.

    The harness finalizes the run from the matrix-compiler's artifact.
    Do not produce a separate final answer after Phase 3; the compiler's
    output is the final deliverable.
  subagentResultMode: artifact_only
  autoFinalizeFromSubagent: matrix-compiler
  skills:
    - name: extract-claims
      version: "1.0.0"
      policy:
        type: always
    - name: matrix-compiler
      version: "1.0.0"
      policy:
        type: always
  limits:
    maxTasksPerRun: 40
    maxOperationsPerTask: 20
    maxTokensPerRun: 800000

graphAssertions:
  - type: run_status
    status: completed
    description: "Decomposition run must complete"

  - type: task_count
    match:
      role: tool
      subagentName: read_artifact
    min: 12
    description: "coordinator must read every seeded vendor dossier"

  - type: task_count
    match:
      subagentName: extract-claims
    min: 12
    description: "extract-claims must be invoked once per vendor"

  - type: task_count
    match:
      role: subagent
      subagentName: matrix-compiler
    min: 1
    max: 1
    description: "exactly one matrix-compiler skill run must exist"

  - type: task_order
    first:
      subagentName: extract-claims
    then:
      role: subagent
      subagentName: matrix-compiler
    description: "extract-claims must precede matrix-compiler"

  - type: consumes
    consumer:
      role: subagent
      subagentName: matrix-compiler
    producer:
      subagentName: extract-claims
    description: "matrix-compiler must consume extract-claims artifacts"

  - type: consumes_absent
    consumer:
      role: subagent
      subagentName: matrix-compiler
    producer:
      role: tool
      subagentName: input_ingestion
    description: "matrix-compiler must not consume raw seeded dossiers"

  - type: task_absent
    match:
      role: tool
      subagentName: answer_from_artifact
    description: "harness-managed finalization should eliminate answer_from_artifact calls"

  - type: run_output_matches_artifact
    task:
      role: subagent
      subagentName: matrix-compiler
    mode: exact
    description: "final answer must be exactly the matrix-compiler artifact content"

  - type: task_absent
    match:
      role: tool
      subagentName: agent
    description: "no ad-hoc `agent` dispatches — fixed-skill pipeline only"
