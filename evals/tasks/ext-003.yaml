passFail:
  minFactualScore: 0.60
  requiredFactIds: [fact-1, fact-2, fact-3]
  minJudgeComposite: 0.5
  description: >-
    Must correctly trace the source code → Confidential Information →
    Residuals → Residuals-excludes-source-code chain. Must identify that
    the liability cap uses the defined term "Fees" which excludes
    Implementation Fees. Must identify that the Order Form overrides the
    MSA's 90-day notice period to 180 days. These three require multi-hop
    reasoning through cross-references — surface-level reading gives the
    wrong answer for each.

