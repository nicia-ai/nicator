# EXT-003 · extraction
#
# A master services agreement with heavily cross-referenced definitions.
# The document is structured like a real enterprise contract: defined terms
# in Section 1 change the meaning of obligations in later sections, and
# several provisions have exceptions-to-exceptions. Getting full marks
# requires:
#   1. Following the "Confidential Information" definition through two
#      levels of exception (carve-out for Residuals, but Residuals
#      excludes source code — so source code IS confidential)
#   2. Reading the indemnification cap in Section 8 correctly: it says
#      "12 months of Fees" but Fees is defined to exclude Implementation
#      Fees, making the actual cap lower than it appears
#   3. Noticing that the termination-for-convenience clause (Section 10.2)
#      requires 90 days notice, but Section 10.4 says the notice period
#      is "as set forth in the applicable Order Form" — and the Order Form
#      excerpt sets it at 180 days
#   4. Parsing the data processing clause where "Personal Data" follows
#      the GDPR definition but the governing law is Delaware — creating
#      a tension the model should flag
#   5. Understanding that the SLA credit cap (Section 6.3) is "per
#      calendar quarter" but the measurement period is "trailing 30 days"
#      — so a month-long outage in the first month of a quarter still
#      only earns one quarter's worth of credits
#
# Floor: Baseline extracts surface-level answers from each section header.
# Ceiling: Full marks require tracing definitions across sections and
# identifying where cross-references create unexpected results.

id: ext-003
category: extraction
